services:
  backend:
    build: ./backend
    container_name: swimtrack-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    restart: always

  frontend:
    build: ./frontend/web
    container_name: swimtrack-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: always